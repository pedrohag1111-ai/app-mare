<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maré</title>
  
  <!-- Ícone da aba do navegador -->
  <link rel="icon" type="image/svg+xml" href="logo-circular.svg">
</head>
<body>

  <!-- CABEÇALHO COM A LOGO HORIZONTAL -->
  <header style="padding: 15px; background-color: #FAF6F1; display: flex; align-items: center;">
    <div style="width: 140px; height: 50px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="100%" height="100%">
        <defs>
          <linearGradient id="fluidHorizGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FF75A2" />
            <stop offset="25%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#BE93DE" />
            <stop offset="75%" stop-color="#332F38" />
            <stop offset="100%" stop-color="#5089C6" />
          </linearGradient>
          <filter id="shadowHoriz" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2E2440" flood-opacity="0.12" />
          </filter>
        </defs>
        <path d="M 50,20 L 250,20 C 280,20 290,50 270,75 C 250,100 220,100 180,90 C 140,80 100,105 50,100 C 20,95 10,65 25,40 C 35,25 40,20 50,20 Z" 
              fill="url(#fluidHorizGrad)" filter="url(#shadowHoriz)" />
        <circle cx="80" cy="60" r="4" fill="#FFFFFF" opacity="0.8" />
        <circle cx="150" cy="55" r="5" fill="#FFFFFF" opacity="0.9" />
        <circle cx="220" cy="60" r="4" fill="#FFFFFF" opacity="0.8" />
      </svg>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; text-align: center;">
    
    <!-- LOGO CIRCULAR NA TELA INICIAL -->
    <div style="width: 120px; height: 120px; margin-bottom: 20px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
        <defs>
          <linearGradient id="fluidCircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FF75A2" />
            <stop offset="25%" stop-color="#FFFFFF" />
            <stop offset="50%" stop-color="#BE93DE" />
            <stop offset="75%" stop-color="#332F38" />
            <stop offset="100%" stop-color="#5089C6" />
          </linearGradient>
          <filter id="shadowCircle" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2E2440" flood-opacity="0.15" />
          </filter>
        </defs>
        <circle cx="100" cy="100" r="80" fill="url(#fluidCircleGrad)" filter="url(#shadowCircle)" />
        <path d="M 100,20 C 140,20 180,60 160,100 C 140,140 110,130 90,150 C 70,170 80,180 100,180 C 55,180 20,145 20,100 C 20,55 55,20 100,20 Z" 
              fill="#FAF6F1" opacity="0.25" />
        <circle cx="100" cy="100" r="5" fill="#FFFFFF" opacity="0.9" />
      </svg>
    </div>

    <h1>Bem-vindo(a) ao Maré</h1>
    <p>O espaço de expressão e fluidez.</p>
  </main>

</body>
</html>
