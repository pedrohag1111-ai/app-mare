<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Marés</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a202c">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-top: 0; color: #38bdf8; font-size: 1.5rem; }
        .status { font-size: 2rem; font-weight: bold; margin: 20px 0; color: #f1f5f9; }
        .details { color: #94a3b8; font-size: 0.95rem; line-height: 1.5; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Previsão de Marés</h1>
        <div class="status" id="tide-status">Carregando...</div>
        <div class="details" id="tide-details">Obtendo dados de maré...</div>
    </div>

    <script>
        // Registra o Service Worker para suporte a PWA (instalação no celular)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (e) => self.skipWaiting());
                    self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
                    self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request)));
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                navigator.serviceWorker.register(swUrl)
                    .then(() => console.log('PWA Service Worker Ativo!'))
                    .catch(err => console.log('Erro no Service Worker:', err));
            });
        }

        // Exemplo de atualização estática na interface
        document.getElementById('tide-status').innerText = 'Maré Enchendo';
        document.getElementById('tide-details').innerText = 'Próxima alta às 14:30 (1.4m)';
    </script>
</body>
</html>
